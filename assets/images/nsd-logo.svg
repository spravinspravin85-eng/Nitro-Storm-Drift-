<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">  
  <defs>  
    <!-- Blue to Orange Gradient for NSD -->  
    <linearGradient id="nsdGrad" x1="0%" y1="0%" x2="100%" y2="0%">  
      <stop offset="0%" stop-color="#00C6FF"/>  
      <stop offset="35%" stop-color="#0066FF"/>  
      <stop offset="65%" stop-color="#FF7A00"/>  
      <stop offset="100%" stop-color="#FFB800"/>  
    </linearGradient>  
    <!-- Car Body Gradient -->  
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="100%" y2="100%">  
      <stop offset="0%" stop-color="#1E3A8A"/>  
      <stop offset="50%" stop-color="#0A0A1A"/>  
      <stop offset="100%" stop-color="#3B82F6"/>  
    </linearGradient>  
    <!-- Fire Gradient -->  
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">  
      <stop offset="0%" stop-color="#FF0000"/>  
      <stop offset="50%" stop-color="#FF7A00"/>  
      <stop offset="100%" stop-color="#FFE600"/>  
    </linearGradient>  
    <filter id="glow">  
      <feGaussianBlur stdDeviation="3" result="blur"/>  
      <feMerge>  
        <feMergeNode in="blur"/>  
        <feMergeNode in="SourceGraphic"/>  
      </feMerge>  
    </filter>  
  </defs>    <!-- Background -->    <rect width="800" height="800" fill="#000000" rx="20"/>    <!-- Storm Clouds -->    <ellipse cx="150" cy="180" rx="160" ry="60" fill="#1A1A2E" opacity="0.9"/>  
  <ellipse cx="650" cy="150" rx="180" ry="70" fill="#1A1A2E" opacity="0.9"/>  
  <ellipse cx="400" cy="100" rx="200" ry="50" fill="#16213E" opacity="0.8"/>    <!-- Outer Shield Frame -->  <path d="M 80 300 L 150 220 L 650 220 L 720 300 L 700 500 L 400 620 L 100 500 Z"   
fill="none" stroke="#FF7A00" stroke-width="5" opacity="0.9"/>
<path d="M 95 305 L 160 235 L 640 235 L 705 305 L 685 485 L 400 600 L 115 485 Z"   
fill="none" stroke="#00C6FF" stroke-width="3" opacity="0.8"/>

  <!-- Lightning Bolts -->  <polyline points="680,80 620,170 660,170 590,300 640,200 600,200 680,80"   
fill="#AEE8FF" stroke="#FFFFFF" stroke-width="2" filter="url(#glow)"/>
<polyline points="120,480 160,560 140,560 190,660"   
fill="none" stroke="#00C6FF" stroke-width="4" filter="url(#glow)"/>
<polyline points="700,400 660,500 680,500 630,600"   
fill="none" stroke="#00C6FF" stroke-width="4" filter="url(#glow)"/>

  <!-- NSD Big Text -->  <text x="400" y="430" text-anchor="middle" font-family="Arial Black, sans-serif"   
font-size="190" font-weight="900" font-style="italic" letter-spacing="-8"  
fill="url(#nsdGrad)" stroke="#000000" stroke-width="10" stroke-linejoin="round">NSD</text>
<text x="400" y="430" text-anchor="middle" font-family="Arial Black, sans-serif"   
font-size="190" font-weight="900" font-style="italic" letter-spacing="-8"  
fill="none" stroke="#FFB800" stroke-width="2" opacity="0.8">NSD</text>

  <!-- NITRO STORM DRIFT -->    <rect x="100" y="455" width="600" height="42" fill="#000000" stroke="#FF7A00" stroke-width="2" rx="5"/>  
  <text x="400" y="484" text-anchor="middle" font-family="Arial, sans-serif"   
        font-size="30" font-weight="900" letter-spacing="6" fill="#FF9A00">NITRO STORM DRIFT</text>    <!-- Speed Lines -->    <line x1="80" y1="560" x2="350" y2="560" stroke="#00C6FF" stroke-width="4"/>  
  <line x1="450" y1="560" x2="720" y2="560" stroke="#FF7A00" stroke-width="4"/>  
  <line x1="120" y1="575" x2="300" y2="575" stroke="#00C6FF" stroke-width="2" opacity="0.6"/>  
  <line x1="500" y1="575" x2="680" y2="575" stroke="#FF7A00" stroke-width="2" opacity="0.6"/>    <!-- Car - Simplified Supercar Silhouette -->    <g transform="translate(0,10)">  
    <!-- Fire / Smoke behind -->  
    <path d="M 90 660 Q 150 600 220 640 Q 280 600 350 650 L 680 650 Q 720 700 650 710 L 100 710 Q 60 690 90 660 Z"   
          fill="url(#fireGrad)" opacity="0.9"/>  
    <ellipse cx="180" cy="680" rx="80" ry="25" fill="#FFFFFF" opacity="0.25"/>  
    <ellipse cx="620" cy="675" rx="90" ry="30" fill="#FFFFFF" opacity="0.3"/>  <!-- Car Body -->  
<path d="M 110 670 L 160 620 L 240 600 L 360 580 L 480 580 L 560 610 L 660 630 L 700 660 L 700 690 L 110 690 Z"   
      fill="url(#carGrad)" stroke="#00C6FF" stroke-width="3"/>  
<!-- Cabin -->  
<path d="M 270 600 L 330 575 L 470 575 L 530 610 L 260 610 Z"   
      fill="#0A0A1A" stroke="#3B82F6" stroke-width="2"/>  
<!-- Headlight -->  
<path d="M 115 650 L 180 640 L 180 655 L 115 660 Z" fill="#00E5FF" filter="url(#glow)"/>  
<!-- Spoiler -->  
<rect x="640" y="595" width="90" height="10" fill="#000000" stroke="#FF7A00" stroke-width="2"/>  
<rect x="700" y="580" width="8" height="25" fill="#000000"/>  

<!-- Wheels -->  
<circle cx="230" cy="685" r="42" fill="#000000" stroke="#FF7A00" stroke-width="4"/>  
<circle cx="230" cy="685" r="20" fill="#1A1A1A" stroke="#555555" stroke-width="2"/>  
<circle cx="580" cy="685" r="42" fill="#000000" stroke="#FF7A00" stroke-width="4"/>  
<circle cx="580" cy="685" r="20" fill="#1A1A1A" stroke="#555555" stroke-width="2"/>  
<!-- Wheel Spokes -->  
<line x1="230" y1="650" x2="230" y2="720" stroke="#FF7A00" stroke-width="2"/>  
<line x1="195" y1="685" x2="265" y2="685" stroke="#FF7A00" stroke-width="2"/>  
<line x1="580" y1="650" x2="580" y2="720" stroke="#FF7A00" stroke-width="2"/>  
<line x1="545" y1="685" x2="615" y2="685" stroke="#FF7A00" stroke-width="2"/>

  </g>    <!-- Bottom Glow Line -->    <path d="M 150 740 L 400 780 L 650 740" fill="none" stroke="#00C6FF" stroke-width="3" opacity="0.7"/>  
  <path d="M 180 740 L 400 765 L 620 740" fill="none" stroke="#FF7A00" stroke-width="2" opacity="0.7"/>  
</svg>
